<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">从你的项目出发，按任务选择工具</title>
  <desc id="desc">结构示意：项目的工作目录和用户参数进入 rotom，由包内 Pi 运行时按任务调用编码、浏览器或 Subagent 工具。它们以本机用户权限运行，并非安全隔离环境。</desc>
  <rect width="1200" height="300" rx="20" fill="#101820"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="58" font-size="22" fill="#aab9c2">从项目出发 · 按任务调用</text>
    <g id="project">
      <rect x="64" y="98" width="280" height="146" rx="12" fill="none" stroke="#344853" stroke-width="2"/>
      <text x="204" y="160" text-anchor="middle" font-size="44" font-weight="600" fill="#eef5f7">你的项目</text>
      <text x="204" y="209" text-anchor="middle" font-size="24" fill="#aab9c2">工作目录 + 用户参数</text>
    </g>
    <g id="runtime">
      <rect x="460" y="98" width="280" height="146" rx="12" fill="#79e2cf"/>
      <text x="600" y="161" text-anchor="middle" font-size="52" font-weight="650" letter-spacing="-2" fill="#101820">rotom</text>
      <text x="600" y="209" text-anchor="middle" font-size="25" fill="#101820">包内 Pi fork</text>
    </g>
    <g id="tools">
      <rect x="856" y="98" width="280" height="146" rx="12" fill="none" stroke="#344853" stroke-width="2"/>
      <text x="996" y="160" text-anchor="middle" font-size="44" font-weight="600" fill="#eef5f7">工具</text>
      <text x="996" y="209" text-anchor="middle" font-size="23" fill="#aab9c2">编码 / 浏览器 / 委派</text>
    </g>
  </g>
  <g id="flow" fill="none" stroke="#79e2cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M369 171 H433 M423 161 L433 171 L423 181"/>
    <path d="M765 171 H829 M819 161 L829 171 L819 181"/>
  </g>
</svg>
