name: Evals L1

on:
  pull_request:
    paths:
      - 'rotom/evals/**'
      - 'rotom/extensions/observability/**'
      - 'rotom/extensions/coding-policy/**'
      - '.github/workflows/evals-l1.yml'
  push:
    branches: [main, eval/system]
    paths:
      - 'rotom/evals/**'
      - 'rotom/extensions/observability/**'
      - 'rotom/extensions/coding-policy/**'
      - '.github/workflows/evals-l1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals-l1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rotom/evals
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rotom/evals/package-lock.json
      - name: Install eval dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org --replace-registry-host=always
      - name: Test eval tools
        run: npm test -- session-cards trace-assertions agreement review session-metrics error-breakdown command-failures
      - name: Test dashboard and eval API
        working-directory: .
        run: node --test rotom/extensions/observability/dashboard.test.mjs rotom/extensions/observability/eval.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Audit public tree
        working-directory: .
        run: python3 scripts/audit-public.py --root .
